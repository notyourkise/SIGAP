# ==========================================
# SIGAP — Docker Compose (Hardened, lihat docs/SECURITY-AUDIT.md temuan 12)
# ==========================================
# Task 7.3: menambahkan service `backup` (cron otomatis) + volume `backups_data`.
# Perubahan keamanan (Fase 2.6):
#   - Quick tunnel (cloudflared) DIHAPUS  -> diganti reverse proxy Nginx + TLS
#   - Port database 5432 TIDAK dipublish  -> hanya diakses dari dalam network
#   - Port backend 3000 / frontend 3000 TIDAK dipublish -> hanya lewat Nginx
#   - Kredensial DB dibaca dari root .env (secret management), TIDAK di-hardcode
#
# Cara pakai:
#   1. cp backend/.env.docker.example backend/.env.docker  lalu isi secret
#   2. cp .env.example .env  lalu isi POSTGRES_PASSWORD (wajib, :? memaksa)
#   3. Buat sertifikat TLS di nginx/certs (lihat nginx/certs/README.md)
#   4. docker compose up -d --build

services:
  # ==========================================
  # Service 1: PostgreSQL Database
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: sigap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigap_user}
      # :? memaksa nilai harus terisi di root .env (mencegah kredensial default bocor)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di root .env}
      POSTGRES_DB: ${POSTGRES_DB:-sigap_db}
    volumes:
      # Named Volume untuk menyimpan data PostgreSQL agar persisten
      - postgres_data:/var/lib/postgresql/data
    # SECURITY: port 5432 TIDAK dipublish ke host — database hanya dapat
    # diakses dari dalam jaringan Docker (oleh service api).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigap_user} -d ${POSTGRES_DB:-sigap_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sigap_network

  # ==========================================
  # Service 2: Redis (Rate-Limit & Blacklist)
  # ==========================================
  # Task 7.2: shared store untuk rate limiter & token blacklist (multi-instance).
  # Port 6379 TIDAK dipublish — hanya diakses dari dalam network (sama seperti DB).
  redis:
    image: redis:7-alpine
    container_name: sigap_redis
    restart: unless-stopped
    # AOF untuk persistensi; requirepass opsional (kosong = tanpa AUTH).
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      # Named Volume untuk persistensi data Redis lintas restart
      - redis_data:/data
    healthcheck:
      # Health check menyesuaikan mode auth (kosong vs terisi REDIS_PASSWORD)
      test: ["CMD-SHELL", "if [ -z \"$$REDIS_PASSWORD\" ]; then redis-cli ping; else redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sigap_network

  # ==========================================
  # Service 3: Go Fiber API Backend
  # ==========================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigap_api
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    environment:
      # SECURITY: default production menonaktifkan Swagger & endpoint diagnostik,
      # mengaktifkan Secure cookie, HSTS, dan CSP ketat. Set APP_ENV=development
      # di root .env hanya bila memang sedang mengembangkan API.
      - APP_ENV=${APP_ENV:-production}
      # Probe langsung Metro-E hanya jika host benar-benar punya rute ke
      # 10.20.105.x. Default false agar deployment lokal tidak menampilkan
      # kamera Metro-E sebagai offline saat jaringan OIKN tidak terjangkau.
      - CCTV_METRO_E_DIRECT_PROBE=${CCTV_METRO_E_DIRECT_PROBE:-false}
      # Level log untuk Task 7.6 (logger terstruktur). Default: info.
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Alamat internal API MediaMTX di network Docker. Mode native-local
      # memakai default 127.0.0.1:9997 dari backend.
      - MEDIAMTX_API_URL=http://mediamtx:9997
      # Alamat HLS internal dipakai untuk memicu path on-demand saat verifikasi
      # status aktif. Bukan URL yang diekspos ke browser.
      - MEDIAMTX_HLS_URL=http://mediamtx:8888
      # Interval verifikasi aktif (menit) dan jumlah worker paralel. Nilai
      # default dibuat konservatif agar NVR/kamera tidak dibuka serentak.
      - CCTV_VERIFY_INTERVAL_MINUTES=${CCTV_VERIFY_INTERVAL_MINUTES:-15}
      - CCTV_VERIFY_CONCURRENCY=${CCTV_VERIFY_CONCURRENCY:-1}
      # SECURITY: DB_PASSWORD TIDAK di-hardcode di sini. Nilai bersumber dari
      # env_file (./backend/.env.docker) dengan prioritas Docker secret
      # (/run/secrets/db_password, dibaca backend/utils/secrets.go).
    # SECURITY: port 3000 TIDAK dipublish — hanya diakses via reverse proxy (Nginx).
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthcheck: service lain (nginx/frontend/mediamtx) menunggu api healthy
    # via depends_on service_healthy — endpoint /api/health (publik) dipakai.
    # Gunakan 127.0.0.1 (bukan localhost) karena API bind di IPv4 0.0.0.0
    # sedangkan localhost bisa resolve ke ::1 (IPv6) -> connection refused.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    # --- Container Hardening (Task 7.5) ---
    # Secret dikirim sebagai FILE Docker secret (di-mount ke /run/secrets/<nama>),
    # bukan sebagai env var. Go app membaca file ini (lihat backend/utils/secrets.go).
    secrets:
      - db_password
      - jwt_secret
      - aes_secret_key
    # Root filesystem read-only: kontainer tidak dapat menulis file sistem.
    # Direktori yang perlu ditulis (uploads, logs, tmp) disediakan via mount
    # terpisah (named volume / bind) agar writable oleh user non-root.
    read_only: true
    # Buang SEMUA capabilities Linux yang tidak diperlukan. Api tidak mengikat
    # port <1024 (berjalan di :3000) sehingga tidak butuh NET_BIND_SERVICE.
    cap_drop:
      - ALL
    volumes:
      # Bind mount untuk menyimpan foto lampiran di luar container (writable).
      - ./backend/uploads:/app/uploads
      # Template email (rendered oleh backend) dibaca dari host agar bisa di-update
      # tanpa rebuild image.
      - ./backend/templates:/app/templates:ro
      # Named volume agar /app/logs & /tmp writable meskipun rootfs read-only.
      - api_logs:/app/logs
      - api_tmp:/tmp
    # Batasan sumber daya: berlaku pada mode `docker compose` lokal DAN swarm.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    # Kompatibilitas mode `docker compose` non-swarm (top-level legacy keys).
    mem_limit: 512M
    cpus: "1.0"
    networks:
      - sigap_network

  # ==========================================
  # Service 4: Next.js Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sigap_frontend
    restart: unless-stopped
    environment:
      # URL backend internal untuk Next.js rewrites (fallback; di produksi
      # reverse proxy Nginx yang menangani /api langsung ke service api).
      - INTERNAL_BACKEND_URL=http://api:3000
      # Dipakai bila frontend diakses langsung di dalam network; trafik publik
      # /stream tetap dipotong lebih dahulu oleh Nginx.
      - INTERNAL_MEDIAMTX_WEBRTC_URL=http://mediamtx:8889
    # SECURITY & SAME-ORIGIN: Port 3001 tidak dipublish agar seluruh trafik
    # dipaksa melalui Reverse Proxy Nginx (https://localhost). Ini menjamin
    # cookie sesi httpOnly dikirim dengan konsisten tanpa masalah cross-origin.
    # ports:
    #   - "3001:3000"
    depends_on:
      - api
    networks:
      - sigap_network

  # ==========================================
  # Service 5: Reverse Proxy Nginx (TLS)
  # ==========================================
  # Menggantikan Cloudflare quick tunnel. Terminasi TLS, security headers,
  # dan routing: /api/* (termasuk /api/ws WebSocket) dan /swagger/* -> api, sisanya -> frontend.
  nginx:
    image: nginx:1.27-alpine
    container_name: sigap_nginx
    restart: unless-stopped
    # Container Hardening (Task 7.5): batasan sumber daya untuk mencegah
    # satu service menghabiskan seluruh resource host.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    mem_limit: 512M
    cpus: "1.0"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
      - mediamtx
    networks:
      sigap_network:
        # IP statis untuk daftar trusted proxy backend (lihat .env.docker →
        # TRUSTED_PROXY_IPS=172.28.0.10) agar header X-Forwarded-For tidak bisa
        # dipalsukan oleh container lain.
        ipv4_address: 172.28.0.10

  # ==========================================
  # Service 6: Backup Otomatis (Task 7.3)
  # ==========================================
  # Menjalankan cron yang memanggil scripts/backup.sh secara berkala:
  #   - pg_dump database -> backups/db/sigap_YYYYMMDD_HHMMSS.sql.gz
  #   - tar uploads      -> backups/uploads/uploads_YYYYMMDD_HHMMSS.tar.gz
  #   - rotasi otomatis  -> hapus backup > 7 hari (RETENTION_DAYS)
  #
  # Konfigurasi:
  #   - Kredensial DB dibaca dari root .env (POSTGRES_USER/PASSWORD/DB).
  #   - Folder uploads di-bind mount read-only dari host (sama dengan service api).
  #   - Hasil backup disimpan ke named volume `backups_data`.
  #   - Jadwal default: tiap hari 06:00 WITA (override via CRON_SCHEDULE + TZ).
  #
  # Akses manual (mis. restore):
  #   docker compose exec backup backup.sh           # jalankan sekali
  #   docker compose exec backup sh                  # shell untuk restore
  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    container_name: sigap_backup
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-sigap_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di root .env}
      DB_NAME: ${POSTGRES_DB:-sigap_db}
      UPLOADS_DIR: /app/uploads
      BACKUP_DIR: /backups
      RETENTION_DAYS: "7"
      TZ: Asia/Makassar
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 6 * * *}
    volumes:
      # Hasil backup disimpan di named volume (persisten, bukan di host fs).
      - backups_data:/backups
      # Folder uploads di-mount read-only (backup hanya membaca).
      - ./backend/uploads:/app/uploads:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sigap_network

  # ==========================================
  # Service 7: MediaMTX — RTSP to WebRTC Proxy (Task 9.2)
  # ==========================================
  mediamtx:
    image: bluenviron/mediamtx:1.20.0-ffmpeg
    container_name: sigap_mediamtx
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8189:8189/udp"
      - "8189:8189/tcp"
    environment:
      # Kandidat ICE harus berupa host/IP yang benar-benar dapat dijangkau
      # browser. Isi IP publik atau DNS deployment pada root .env.
      - MTX_WEBRTCADDITIONALHOSTS=${MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS:?MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS wajib diisi dengan domain atau IP yang dapat dijangkau browser}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
    mem_limit: 1024M
    cpus: '2.0'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9997/v3/config/global/get"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      sigap_network:
        ipv4_address: 172.28.0.11

# ==========================================
# Named Volumes
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # Task 7.3: volume tempat backup db & uploads disimpan.
  backups_data:
    driver: local
  # Task 7.5: volume untuk direktori writable service api pada rootfs read-only.
  api_logs:
    driver: local
  api_tmp:
    driver: local

# ==========================================
# Secrets (Task 7.5 — Container Hardening)
# ==========================================
# Secret dikirim ke container api sebagai FILE (di-mount ke /run/secrets/<nama>)
# alih-alih env var, agar tidak bocor lewat `docker inspect` / proses env.
#
# BUAT file secret lokal (JANGAN commit ke git) sebelum `docker compose up`:
#   mkdir -p secrets
#   printf '%s' 'PASSWORD_DB_AMAN'        > secrets/db_password
#   printf '%s' 'JWT_SECRET_AMAN'         > secrets/jwt_secret
#   printf '%s' 'AES_SECRET_KEY_256_BIT'  > secrets/aes_secret_key
#   chmod 600 secrets/*
#
# Catatan: dengan `docker compose` (non-swarm), secret dibaca sebagai file
# terpisah dan nilainya TIDAK otomatis menjadi env var — aplikasi membacanya
# secara eksplisit (backend/utils/secrets.go). Direktori `secrets/` di-.gitignore.
secrets:
  db_password:
    file: ./secrets/db_password
  jwt_secret:
    file: ./secrets/jwt_secret
  aes_secret_key:
    file: ./secrets/aes_secret_key

# ==========================================
# Networks
# ==========================================
# Subnet ditentukan secara eksplisit agar IP statis nginx valid.
networks:
  sigap_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
