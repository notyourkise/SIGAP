name: CI Monorepo SIGAP

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  # Job untuk mendeteksi perubahan jalur berkas (paths filter)
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Paths Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # Job untuk validasi dan pengujian Backend Go
  backend-ci:
    name: Backend CI (Go)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      # PostgreSQL sementara untuk verifikasi migrasi DB versioned (Task 7.1).
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sigap
          POSTGRES_PASSWORD: sigap
          POSTGRES_DB: sigap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigap -d sigap_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: 'backend/go.sum'

      - name: Install Dependencies
        run: go mod download
        working-directory: ./backend

      - name: Run DB Migration (up -> down -> up)
        # Memverifikasi migration versioned end-to-end terhadap PostgreSQL
        # nyata: terapkan semua migration, rollback semua, terapkan lagi.
        run: |
          go run cmd/migrate/main.go up
          go run cmd/migrate/main.go down
          go run cmd/migrate/main.go up
          go run cmd/migrate/main.go version
        working-directory: ./backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USER: sigap
          DB_PASSWORD: sigap
          DB_NAME: sigap_test

      - name: Run Tests
        run: go test -v ./...
        working-directory: ./backend

      - name: Run Go Linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: ./backend

  # Job untuk validasi dan pembuatan Frontend Next.js
  frontend-ci:
    name: Frontend CI (Next.js)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run Build
        run: npm run build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api

      - name: Run Lint
        run: npm run lint
        working-directory: ./frontend
