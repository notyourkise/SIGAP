###############################################
# MediaMTX — SIGAP CCTV Streaming Relay
# Task 9.2: RTSP-to-WebRTC proxy, zero transcoding
###############################################
logLevel: info
logDestinations: [stdout]
# RTSP Server (internal, menerima re-stream dari NVR)
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
# WebRTC Server (WHEP output ke browser)
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# TCP memakai port yang sama sebagai fallback untuk jaringan kantor/seluler
# yang memblokir UDP. Media tetap WebRTC relay tanpa transcoding.
webrtcLocalTCPAddress: :8189
# Jangan iklankan alamat bridge Docker (172.28.x.x) kepada browser; kandidat
# yang sah harus datang dari MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS atau STUN.
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: []
# Jangan percaya X-Forwarded-For pada MediaMTX agar pemeriksaan IP internal
# pada authInternalUsers tetap mengikat ke proxy terautentikasi (Nginx/Backend).
webrtcTrustedProxies: []
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
# HLS Fallback
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: no
# Low-Latency HLS menolak playlist dengan kurang dari 7 segmen.
hlsSegmentCount: 7
hlsSegmentDuration: 1s
# REST API (untuk Go backend)
api: yes
apiAddress: :9997

# Autentikasi internal (H01 / #167):
#   - read/playback: HANYA diizinkan dari jaringan internal (loopback / subnet
#     Docker 172.28.0.0/16 tempat Nginx & Backend berada setelah memvalidasi
#     sesi Admin via /api/streams/auth), dan dibatasi ke pola path kamera resmi.
#   - api/metrics/pprof: dibatasi ke subnet internal Docker & loopback.
authInternalUsers:
  - user: any
    pass: ""
    ips:
      - 127.0.0.1/32
      - ::1/128
      - 172.28.0.0/16
    permissions:
      - action: read
        path: "~^cam-[0-9a-fA-F-]{36}$"
      - action: playback
        path: "~^cam-[0-9a-fA-F-]{36}$"
  - user: any
    pass: ""
    ips:
      - 127.0.0.1/32
      - ::1/128
      - 172.28.0.0/16
    permissions:
      - action: api
        path: ""
      - action: metrics
        path: ""
      - action: pprof
        path: ""

# Path defaults — on-demand pull dari NVR
pathDefaults:
  sourceOnDemand: yes
  sourceOnDemandStartTimeout: 10s
  sourceOnDemandCloseAfter: 5s
  rtspTransport: tcp
# Path dikonfigurasi DINAMIS via REST API
paths: {}
