  /ws:
    get:
      description: 'Membuka koneksi bi-directional WebSocket real-time untuk menerima
        siaran langsung event sistem (CCTV_UPDATED, MAINTENANCE_CREATED, MAINTENANCE_UPDATED,
        AUDIT_LOG_ADDED). Event AUDIT_LOG_ADDED hanya dikirim ke koneksi admin. Autentikasi
        wajib: sertakan token JWT sebagai query parameter `token`.'
      parameters:
      - description: Token JWT (Bearer) untuk autentikasi
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols ke WebSocket
          schema:
            type: string
        "400":
          description: 'Header Upgrade: websocket wajib dikirimkan'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Token tidak valid / tidak ditemukan
          schema:
            additionalProperties: true
            type: object
      summary: Koneksi Real-time WebSocket Broadcast
      tags:
      - WebSocket
  /zones:
    get:
      consumes:
      - application/json
      description: Mendapatkan daftar zona operasional terpaginasi dengan pencarian
        nama dan jumlah CCTV/teknisi per zona.
      parameters:
      - description: Pencarian berdasarkan nama zona
        in: query
        name: search
        type: string
      - description: 'Nomor Halaman (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Jumlah data per halaman (default: 10)'
        in: query
        name: limit
        type: integer
      - description: 'Kolom pengurutan (default: created_at)'
        in: query
        name: sort_by
        type: string
      - description: 'Arah pengurutan: asc, desc (default: desc)'
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Daftar zona terpaginasi
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid / Token tidak terdaftar
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil daftar zona
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Ambil Semua Zona
      tags:
      - Zona
