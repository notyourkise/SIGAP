      - BearerAuth: []
      summary: Unggah Foto Pemeliharaan
      tags:
      - Upload
  /uploads/{filename}:
    get:
      description: Mengambil file gambar yang sudah diunggah berdasarkan nama file.
        Memerlukan autentikasi JWT.
      parameters:
      - description: Nama file gambar (UUID.ext)
        in: path
        name: filename
        required: true
        type: string
      produces:
      - image/jpeg
      - image/png
      - image/webp
      responses:
        "200":
          description: File gambar
          schema:
            type: file
        "400":
          description: Nama file tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: File tidak ditemukan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Ambil File Foto Pemeliharaan
      tags:
      - Upload
  /users:
    get:
      description: Mengembalikan daftar pengguna terdaftar berdasarkan parameter pencarian,
        pengurutan, dan paginasi. Hanya bisa diakses oleh Admin.
      parameters:
      - description: 'Nomor Halaman (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Jumlah Data per Halaman (default: 10)'
        in: query
        name: limit
        type: integer
      - description: Kolom Pengurutan (username, full_name, email, role, created_at)
        in: query
        name: sort_by
        type: string
      - description: Arah Pengurutan (asc, desc)
        in: query
        name: order
        type: string
      - description: Cari berdasarkan username, full_name, atau email
        in: query
        name: search
        type: string
      - description: Filter berdasarkan peran (admin, teknisi)
        in: query
        name: role
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Sukses mendapatkan daftar pengguna
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Akses ditolak
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan Daftar Pengguna
      tags:
      - Manajemen Pengguna
  /users/{id}:
    delete:
      description: Menghapus data pengguna dari sistem menggunakan mekanisme soft-delete.
        Hanya bisa diakses oleh Admin.
      parameters:
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Sukses menghapus pengguna
          schema:
            additionalProperties: true
            type: object
        "400":
          description: UUID tidak valid / Tidak bisa menghapus diri sendiri
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Akses ditolak
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Pengguna tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menghapus pengguna
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Menghapus Pengguna (Soft Delete)
      tags:
      - Manajemen Pengguna
    get:
      description: Mengembalikan informasi lengkap satu pengguna berdasarkan UUID.
        Hanya bisa diakses oleh Admin.
      parameters:
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Sukses mendapatkan detail pengguna
          schema:
            additionalProperties: true
            type: object
        "400":
          description: UUID tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Akses ditolak
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Pengguna tidak ditemukan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan Detail Pengguna
      tags:
      - Manajemen Pengguna
    put:
      consumes:
      - application/json
      description: Memperbarui data nama lengkap (full_name), email, atau peran (role)
        pengguna. Hanya bisa diakses oleh Admin.
      parameters:
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      - description: Data pembaruan user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Sukses memperbarui pengguna
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Input tidak valid / Email duplikat
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Akses ditolak
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Pengguna tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal memperbarui pengguna
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Memperbarui Profil Pengguna
      tags:
      - Manajemen Pengguna
  /users/{id}/reset-password:
    post:
      consumes:
      - application/json
      description: Menyetel ulang sandi pengguna secara paksa ke sandi baru pilihan
        Admin. Hanya bisa diakses oleh Admin.
      parameters:
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      - description: Data password baru
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ResetUserPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Sukses reset password
          schema:
            additionalProperties: true
            type: object
        "400":
          description: UUID tidak valid / Validasi gagal
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Akses ditolak
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Pengguna tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal enkripsi / Gagal menyimpan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Reset Password Pengguna
      tags:
      - Manajemen Pengguna
  /ws:
    get:
      description: 'Membuka koneksi bi-directional WebSocket real-time untuk menerima
        siaran langsung event sistem (CCTV_UPDATED, MAINTENANCE_CREATED, MAINTENANCE_UPDATED,
        AUDIT_LOG_ADDED). Autentikasi wajib: sertakan token JWT sebagai query parameter
        `token`.'
      parameters:
      - description: Token JWT (Bearer) untuk autentikasi
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols ke WebSocket
          schema:
            type: string
        "400":
          description: 'Header Upgrade: websocket wajib dikirimkan'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Token tidak valid / tidak ditemukan
          schema:
            additionalProperties: true
            type: object
      summary: Koneksi Real-time WebSocket Broadcast
      tags:
      - WebSocket
schemes:
- https
securityDefinitions:
  BearerAuth:
    description: 'Format token JWT: Bearer <token_anda>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
