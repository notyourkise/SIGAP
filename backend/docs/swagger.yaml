  /webhooks/{id}/test:
    post:
      consumes:
      - application/json
      description: Mengirim payload uji (event test.ping) ke endpoint dan mengembalikan
        status respons serta latensi.
      parameters:
      - description: Webhook Endpoint UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Hasil test delivery
          schema:
            additionalProperties: true
            type: object
        "400":
          description: UUID tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid / Token tidak terdaftar
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Akses ditolak: Hanya Admin yang diperbolehkan'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Webhook endpoint tidak ditemukan
          schema:
            additionalProperties: true
            type: object
