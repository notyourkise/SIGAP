basePath: /api
definitions:
  handlers.AssignMaintenanceLogRequest:
    properties:
      technician_id:
        type: string
    required:
    - technician_id
    type: object
  handlers.ChangePasswordRequest:
    properties:
      new_password:
        maxLength: 100
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  handlers.CompleteMaintenanceLogRequest:
    properties:
      checks:
        items:
          $ref: '#/definitions/handlers.FieldCheckItem'
        minItems: 1
        type: array
      images:
        items:
          $ref: '#/definitions/handlers.FieldImageItem'
        maxItems: 5
        minItems: 1
        type: array
      notes:
        maxLength: 1000
        type: string
    required:
    - checks
    - images
    type: object
  handlers.CreateCCTVRequest:
    properties:
      id_channel:
        maxLength: 50
        type: string
      indoor_outdoor:
        enum:
        - indoor
        - outdoor
        - INDOOR
        - OUTDOOR
        type: string
      ip_camera:
        type: string
      ip_nvr:
        type: string
      jenis_cctv:
        maxLength: 50
        type: string
      keterangan:
        type: string
      kode_cctv:
        maxLength: 50
        minLength: 3
        type: string
      latitude:
        maxLength: 50
        type: string
      lokasi_area:
        maxLength: 255
        type: string
      longitude:
        maxLength: 50
        type: string
      nama:
        maxLength: 100
        minLength: 3
        type: string
      pemilik:
        maxLength: 100
        type: string
      status:
        enum:
        - aktif
        - rusak
        - pemeliharaan
        - nonaktif
        type: string
      sumber_listrik:
        maxLength: 50
        type: string
      tipe_koneksi:
        maxLength: 50
        type: string
    required:
    - kode_cctv
    - nama
    - status
    type: object
  handlers.CreateFieldMaintenanceRequest:
    properties:
      cctv_id:
        type: string
      checks:
        items:
          $ref: '#/definitions/handlers.FieldCheckItem'
        minItems: 1
        type: array
      images:
        items:
          $ref: '#/definitions/handlers.FieldImageItem'
        maxItems: 5
        minItems: 1
        type: array
      notes:
        maxLength: 1000
        type: string
    required:
    - cctv_id
    - checks
    - images
    type: object
  handlers.CreateMaintenanceLogRequest:
    properties:
      action_taken:
        minLength: 5
        type: string
      cctv_id:
        type: string
      image_url:
        description: URL dari endpoint /api/upload
        type: string
      notes:
        type: string
      scheduled_date:
        description: YYYY-MM-DD HH:MM:SS or RFC3339
        type: string
      status:
        description: |-
          Status hanya boleh bernilai "scheduled" saat pembuatan — alur status
          selanjutnya dikelola sistem: assign teknisi (-> ongoing) dan penyelesaian
          checklist (-> completed/failed), tidak bisa diubah manual lewat API.
        enum:
        - scheduled
        type: string
    required:
    - action_taken
    - cctv_id
    type: object
  handlers.CreateUserRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        maxLength: 100
        minLength: 8
        type: string
      role:
        enum:
        - admin
        - teknisi
        type: string
      username:
        maxLength: 50
        minLength: 4
        type: string
    required:
    - email
    - full_name
    - password
    - role
    - username
    type: object
  handlers.FieldCheckItem:
    properties:
      name:
        maxLength: 150
        minLength: 3
        type: string
      note:
        maxLength: 500
        type: string
      result:
        enum:
        - ok
        - not_ok
        type: string
    required:
    - name
    - result
    type: object
  handlers.FieldImageItem:
    properties:
      image_url:
        type: string
    required:
    - image_url
    type: object
  handlers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handlers.ResetUserPasswordRequest:
    properties:
      new_password:
        maxLength: 100
        minLength: 8
        type: string
    required:
    - new_password
    type: object
  handlers.ScanCCTVRequest:
    properties:
      qr_payload:
        type: string
    required:
    - qr_payload
    type: object
  handlers.UpdateCCTVRequest:
    properties:
      id_channel:
        maxLength: 50
        type: string
      indoor_outdoor:
        enum:
        - indoor
        - outdoor
        - INDOOR
        - OUTDOOR
        type: string
      ip_camera:
        type: string
      ip_nvr:
        type: string
      jenis_cctv:
        maxLength: 50
        type: string
      keterangan:
        type: string
      kode_cctv:
        maxLength: 50
        minLength: 3
        type: string
      latitude:
        maxLength: 50
        type: string
      lokasi_area:
        maxLength: 255
        type: string
      longitude:
        maxLength: 50
        type: string
      nama:
        maxLength: 100
        minLength: 3
        type: string
      pemilik:
        maxLength: 100
        type: string
      status:
        enum:
        - aktif
        - rusak
        - pemeliharaan
        - nonaktif
        type: string
      sumber_listrik:
        maxLength: 50
        type: string
      tipe_koneksi:
        maxLength: 50
        type: string
    type: object
  handlers.UpdateMaintenanceLogRequest:
    properties:
      action_taken:
        minLength: 5
        type: string
      cctv_id:
        type: string
      image_url:
        description: URL baru dari /api/upload (opsional)
        type: string
      notes:
        type: string
      scheduled_date:
        description: YYYY-MM-DD HH:MM:SS or RFC3339
        type: string
    type: object
  handlers.UpdateMyProfileRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      profile_photo_url:
        description: |-
          ProfilePhotoURL bersifat opsional: nil = biarkan foto saat ini, "" = hapus
          foto, selain itu harus path file upload SIGAP ("/api/uploads/...").
        type: string
    required:
    - full_name
    type: object
  handlers.UpdateUserRequest:
    properties:
      email:
        maxLength: 100
        type: string
      full_name:
        maxLength: 100
        minLength: 3
        type: string
      role:
        enum:
        - admin
        - teknisi
        type: string
    type: object
host: localhost
info:
  contact: {}
  description: Dokumentasi API Sistem Identifikasi Gangguan Aset Pusat (SIGAP) IKN.
  title: SIGAP API
  version: "1.0"
paths:
  /audit-logs:
    get:
      description: Mengembalikan daftar riwayat aktivitas sistem berdasarkan filter
        modul, rentang tanggal, pencarian, pengurutan, dan paginasi. Hanya bisa diakses
        oleh Admin.
      parameters:
      - description: 'Nomor Halaman (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Jumlah Data per Halaman (default: 10)'
        in: query
        name: limit
        type: integer
      - description: Kolom Pengurutan (created_at, action, module, username)
        in: query
        name: sort_by
        type: string
      - description: Arah Pengurutan (asc, desc)
        in: query
        name: order
        type: string
      - description: Filter berdasarkan nama modul (AUTH, CCTV, ASSET, MAINTENANCE,
          USER)
        in: query
        name: module
        type: string
      - description: Filter rentang awal (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Filter rentang akhir (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: Cari berdasarkan username, action, description, atau ip_address
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Sukses mendapatkan daftar audit log
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Akses ditolak
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan Daftar Audit Log
      tags:
      - Audit Log
  /audit-logs/export:
    get:
      description: Mengunduh seluruh riwayat aktivitas sistem terfilter (tanpa limit
        halaman) dalam format file CSV. Hanya bisa diakses oleh Admin.
      parameters:
      - description: Filter berdasarkan nama modul
        in: query
        name: module
        type: string
      - description: Filter rentang awal (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Filter rentang akhir (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: Cari berdasarkan username, action, description, atau ip_address
        in: query
        name: search
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: File CSV Audit Log
          schema:
            type: file
        "401":
          description: Sesi tidak valid
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Akses ditolak
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengekspor data
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Ekspor Audit Log ke CSV
      tags:
      - Audit Log
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Mengganti password akun sendiri (self-service). Wajib menyertakan
        password lama.
      parameters:
      - description: Password lama & baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password berhasil diubah, sesi baru diterbitkan
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validasi input gagal / password lama salah / password baru
            sama
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menyimpan password baru
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Ganti Password Sendiri
      tags:
      - Autentikasi
  /auth/login:
    post:
      consumes:
      - application/json
      description: Masuk ke sistem SIGAP menggunakan username/email dan password,
        mengembalikan token JWT.
      parameters:
      - description: Kredensial Login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Sukses login dengan token JWT
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Format input tidak valid atau data kurang
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Username atau password salah
          schema:
            additionalProperties: true
            type: object
      summary: Login Pengguna
      tags:
      - Autentikasi
  /auth/logout:
    post:
      description: Merevoke token JWT aktif bila valid dan selalu menghapus cookie
        sesi/CSRF. Token invalid atau kosong tetap dianggap logout berhasil.
      produces:
      - application/json
      responses:
        "200":
          description: Logout berhasil, token diinvalidasi
          schema:
            additionalProperties: true
            type: object
      summary: Logout Pengguna
      tags:
      - Autentikasi
  /auth/me:
    get:
      description: Mengembalikan data profil lengkap pengguna yang sedang terautentikasi
        berdasarkan token JWT.
      produces:
      - application/json
      responses:
        "200":
          description: Data profil pengguna
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Pengguna tidak ditemukan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Profil Pengguna Saat Ini
      tags:
      - Autentikasi
  /auth/profile:
    put:
      consumes:
      - application/json
      description: Mengubah nama tampilan (full_name) dan/atau foto profil (profile_photo_url,
        path dari endpoint upload) milik pengguna yang sedang login.
      parameters:
      - description: Data Profil yang diperbarui
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateMyProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Profil berhasil diperbarui
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Format/validasi tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid / Pengguna tidak ditemukan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Perbarui Profil Sendiri
      tags:
      - Autentikasi
  /auth/users:
    post:
      consumes:
      - application/json
      description: Membuat akun user baru (Admin/Teknisi). Hanya dapat diakses oleh
        Admin.
      parameters:
      - description: Data User Baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User baru berhasil dibuat
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Format tidak valid, email/username sudah dipakai, role tidak
            valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid / Token tidak terdaftar
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Akses ditolak: Hanya Admin yang diperbolehkan'
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Registrasi User Baru
      tags:
      - Autentikasi
  /cctv:
    get:
      consumes:
      - application/json
      description: Mendapatkan daftar data master CCTV dengan paginasi, pencarian,
        dan penyaringan berdasarkan status, lokasi, jenis, pemilik, dll.
      parameters:
      - description: Filter berdasarkan status
        in: query
        name: status
        type: string
      - description: Filter berdasarkan jenis CCTV
        in: query
        name: jenis_cctv
        type: string
      - description: Filter berdasarkan indoor/outdoor
        in: query
        name: indoor_outdoor
        type: string
      - description: Cari berdasarkan nama, kode_cctv, id_channel, lokasi_area
        in: query
        name: search
        type: string
      - description: 'Nomor Halaman (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Jumlah data per halaman (default: 10)'
        in: query
        name: limit
        type: integer
      - description: 'Kolom pengurutan (default: created_at)'
        in: query
        name: sort_by
        type: string
      - description: 'Arah pengurutan: asc, desc (default: desc)'
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Daftar CCTV terpaginasi
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid / Token tidak terdaftar
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Ambil Semua Data CCTV
      tags:
      - Master CCTV
    post:
      consumes:
      - application/json
      description: Membuat record master data CCTV baru. Sistem otomatis membuat UUID
        ID baru, mengenkripsinya dengan AES-256, lalu menyimpan hasilnya sebagai QrPayload
        unik.
      parameters:
      - description: Data CCTV Baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateCCTVRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Data CCTV berhasil disimpan
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Format input salah, validasi gagal, kode_cctv duplikat
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid / Token tidak terdaftar
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Akses ditolak: Hanya Admin yang diperbolehkan'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengenkripsi atau menyimpan data ke database
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Tambah Data CCTV
      tags:
      - Master CCTV
  /cctv/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus data CCTV secara soft-delete berdasarkan UUID. Hanya
        dapat diakses oleh Admin.
      parameters:
      - description: CCTV UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Data CCTV berhasil dihapus secara soft-delete
          schema:
            additionalProperties: true
            type: object
        "400":
          description: UUID tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid / Token tidak terdaftar
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Akses ditolak: Hanya Admin yang diperbolehkan'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: CCTV tidak ditemukan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Hapus Data CCTV
      tags:
      - Master CCTV
    get:
      consumes:
      - application/json
      description: Mendapatkan detail CCTV berdasarkan UUID-nya.
      parameters:
      - description: CCTV UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Detail data CCTV ditemukan
          schema:
            additionalProperties: true
            type: object
        "400":
          description: UUID tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid / Token tidak terdaftar
          schema:
            additionalProperties: true
            type: object
        "404":
          description: CCTV tidak ditemukan
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Ambil CCTV Detail
      tags:
      - Master CCTV
    put:
      consumes:
      - application/json
      description: Mengubah detail data master CCTV yang sudah terdaftar. Hanya dapat
        diakses oleh Admin.
      parameters:
      - description: CCTV UUID
        in: path
        name: id
        required: true
        type: string
      - description: Data Update CCTV
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateCCTVRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Data CCTV berhasil diperbarui
          schema:
            additionalProperties: true
            type: object
        "400":
          description: UUID tidak valid, format body salah, atau validasi gagal
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid / Token tidak terdaftar
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Akses ditolak: Hanya Admin yang diperbolehkan'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: CCTV tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal menyimpan perubahan ke database
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Edit Data CCTV
      tags:
      - Master CCTV
  /cctv/{id}/qrcode:
    get:
      description: Membuat QR Code dalam format PNG berisi payload QR terenkripsi
        (AES-256) milik perangkat CCTV. Hasil pindaian QR ini dapat diidentifikasi
        melalui endpoint /cctv/scan.
      parameters:
      - description: CCTV UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: Gambar QR Code dalam format raw PNG
          schema:
            type: string
        "400":
          description: UUID tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid
          schema:
            additionalProperties: true
            type: object
        "404":
          description: CCTV tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal memproses QR Code
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Unduh QR Code CCTV
      tags:
      - Master CCTV
  /cctv/import:
    post:
      consumes:
      - multipart/form-data
      description: Mengunggah berkas Excel (.xlsx) yang diisi sesuai template standar
        untuk diimpor secara massal ke dalam database. UUID dienkripsi dengan AES-256
        untuk kolom QrPayload.
      parameters:
      - description: Berkas Excel Template CCTV (.xlsx)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Proses impor selesai dengan detail jumlah sukses/gagal
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Tidak ada file / format file tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Akses ditolak: Hanya Admin yang diperbolehkan'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal membaca atau memproses berkas Excel
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Impor Massal Data CCTV
      tags:
      - Master CCTV
  /cctv/scan:
    post:
      consumes:
      - application/json
      description: Menerima parameter string QR Payload terenkripsi, mendekripsinya
        menggunakan AES-256 untuk mendapatkan UUID asli, lalu mengembalikan data umum
        CCTV yang cocok.
      parameters:
      - description: Payload QR Terenkripsi dari CCTV fisik
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ScanCCTVRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Identitas CCTV berhasil dipindai dan ditemukan
          schema:
            additionalProperties: true
            type: object
        "400":
          description: QR Payload tidak valid atau gagal didekripsi
          schema:
            additionalProperties: true
