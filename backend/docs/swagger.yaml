      responses:
        "200":
          description: Daftar delivery terpaginasi
          schema:
            additionalProperties: true
            type: object
        "400":
          description: UUID tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid / Token tidak terdaftar
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil riwayat pengiriman
          schema:
            additionalProperties: true
            type: object
