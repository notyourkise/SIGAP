basePath: /api
definitions:
  handlers.AssignCCTVRequest:
    properties:
      cctv_ids:
        description: CCTVIDs adalah daftar ID CCTV yang akan ditetapkan ke zona.
        items:
          type: string
        type: array
    required:
    - cctv_ids
    type: object
  handlers.AssignMaintenanceLogRequest:
    properties:
      technician_id:
        type: string
    required:
    - technician_id
    type: object
  handlers.AssignSiteUsersRequest:
    properties:
      user_ids:
        description: UserIDs adalah daftar ID user (teknisi) yang akan ditetapkan
          ke site.
        items:
          type: string
        type: array
    required:
    - user_ids
    type: object
  handlers.AssignUsersRequest:
    properties:
      user_ids:
        description: UserIDs adalah daftar ID user (teknisi) yang akan ditetapkan
          ke zona.
        items:
          type: string
        type: array
    required:
    - user_ids
    type: object
  handlers.ChangePasswordRequest:
    properties:
      new_password:
        maxLength: 100
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    type: object
  handlers.CompleteMaintenanceLogRequest:
    properties:
      checks:
        items:
          $ref: '#/definitions/handlers.FieldCheckItem'
        minItems: 1
        type: array
      images:
        items:
          $ref: '#/definitions/handlers.FieldImageItem'
        maxItems: 5
        minItems: 1
        type: array
      notes:
        maxLength: 1000
        type: string
    required:
    - checks
    - images
    type: object
  handlers.CreateAPIKeyRequest:
    properties:
      expires_in_days:
        description: 0 = tidak pernah
        minimum: 1
        type: integer
      name:
        maxLength: 100
        minLength: 2
        type: string
      scopes:
        items:
          type: string
        type: array
    required:
    - name
    - scopes
    type: object
  handlers.CreateCCTVRequest:
    properties:
      channel_port:
        type: integer
      id_channel:
        maxLength: 50
        type: string
      indoor_outdoor:
        enum:
        - indoor
        - outdoor
        - INDOOR
        - OUTDOOR
        type: string
      ip_camera:
        type: string
      ip_nvr:
        type: string
      jenis_cctv:
        maxLength: 50
        type: string
      keterangan:
        type: string
      kode_cctv:
        maxLength: 50
        minLength: 3
        type: string
      latitude:
        type: number
      lokasi_area:
        maxLength: 255
        type: string
      longitude:
        type: number
      nama:
        maxLength: 100
        minLength: 3
        type: string
      pemilik:
        maxLength: 100
        type: string
      rtsp_password:
        type: string
      rtsp_url:
        maxLength: 500
        type: string
      site_id:
        allOf:
        - $ref: '#/definitions/utils.OptionalUUID'
        description: SiteID menunjuk kawasan operasional (Task 12.2) — opsional.
      status:
        enum:
        - aktif
        - pemeliharaan
        - nonaktif
        type: string
      stream_enabled:
        type: boolean
      sumber_listrik:
        maxLength: 50
        type: string
      tipe_koneksi:
        maxLength: 50
        type: string
      zone_id:
        allOf:
        - $ref: '#/definitions/utils.OptionalUUID'
        description: ZoneID menunjuk zona operasional (Task 11.4) — opsional.
    required:
    - kode_cctv
    - nama
    - status
    type: object
  handlers.CreateChecklistTemplateRequest:
    properties:
      aktif:
        type: boolean
      deskripsi:
        maxLength: 2000
        type: string
      nama_item:
        maxLength: 255
        minLength: 1
        type: string
      site_id:
        description: SiteID menunjuk kawasan (site) — nil/kosong berarti template
          global.
        type: string
      urutan:
        minimum: 0
        type: integer
      wajib:
        type: boolean
    required:
    - nama_item
    type: object
  handlers.CreateFieldMaintenanceRequest:
    properties:
      cctv_id:
        type: string
      check_latitude:
        type: string
      check_longitude:
        type: string
      checks:
        items:
          $ref: '#/definitions/handlers.FieldCheckItem'
        minItems: 1
        type: array
      images:
        items:
          $ref: '#/definitions/handlers.FieldImageItem'
        maxItems: 5
        minItems: 1
        type: array
      notes:
        maxLength: 1000
        type: string
    required:
    - cctv_id
    - checks
    - images
    type: object
  handlers.CreateMaintenanceLogRequest:
    properties:
      action_taken:
        minLength: 5
        type: string
      cctv_id:
        type: string
      image_url:
        description: URL dari endpoint /api/upload
        type: string
      notes:
        type: string
      scheduled_date:
        description: YYYY-MM-DD HH:MM:SS or RFC3339
        type: string
      status:
        description: |-
          Status hanya boleh bernilai "scheduled" saat pembuatan — alur status
          selanjutnya dikelola sistem: assign teknisi (-> ongoing) dan penyelesaian
          checklist (-> completed/failed), tidak bisa diubah manual lewat API.
        enum:
        - scheduled
        type: string
    required:
    - action_taken
    - cctv_id
    type: object
  handlers.CreateMaintenanceScheduleRequest:
    properties:
      action_taken:
        minLength: 5
        type: string
      cctv_id:
        type: string
      frequency:
        enum:
        - daily
        - weekly
        - monthly
        type: string
      technician_id:
        type: string
    required:
    - action_taken
    - cctv_id
    - frequency
    type: object
  handlers.CreateSLAPolicyRequest:
    properties:
      jenis_tugas:
        enum:
        - corrective
        - preventive
        - field_check
        type: string
      nama:
        maxLength: 100
        minLength: 2
        type: string
      target_jam_respon:
        minimum: 0
        type: integer
      target_jam_selesai:
        minimum: 1
        type: integer
    required:
    - jenis_tugas
    - nama
    - target_jam_respon
    - target_jam_selesai
    type: object
  handlers.CreateSiteRequest:
    properties:
      alamat:
        type: string
      is_default:
        type: boolean
      kode:
        maxLength: 20
        minLength: 1
        type: string
      koordinat_lat:
        type: number
      koordinat_lng:
        type: number
      nama:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - kode
    - nama
    type: object
  handlers.CreateSparePartRequest:
    properties:
      harga_satuan:
        minimum: 0
        type: number
      kategori:
        maxLength: 50
        type: string
      keterangan:
        type: string
      minimum_order:
        minimum: 0
        type: integer
      nama:
        maxLength: 100
        minLength: 2
        type: string
      satuan:
        maxLength: 20
        type: string
      site_id:
        type: string
      sku:
        maxLength: 50
        minLength: 2
        type: string
      stok:
        minimum: 0
        type: integer
    required:
    - nama
    - sku
    type: object
  handlers.CreateUserRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        maxLength: 100
        minLength: 8
        type: string
      role:
        enum:
        - admin
        - teknisi
        type: string
      username:
        maxLength: 50
        minLength: 4
        type: string
    required:
    - email
    - full_name
    - password
    - role
    - username
    type: object
  handlers.CreateWebhookRequest:
    properties:
      events:
        items:
          type: string
        type: array
      max_log_retention_days:
        minimum: 1
        type: integer
      name:
        maxLength: 100
        minLength: 2
        type: string
      secret:
        minLength: 8
        type: string
      url:
        type: string
    required:
    - events
    - name
    - secret
    - url
    type: object
  handlers.CreateZoneRequest:
    properties:
      deskripsi:
        type: string
      nama:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - nama
    type: object
  handlers.EmailPreferencesRequest:
    properties:
      email_daily_digest:
        type: boolean
      email_notifications:
        type: boolean
      email_overdue:
        type: boolean
      email_stock_low:
        type: boolean
    type: object
  handlers.FieldCheckItem:
    properties:
      name:
        maxLength: 150
        minLength: 3
        type: string
      note:
        maxLength: 500
        type: string
      result:
        enum:
        - ok
        - not_ok
        type: string
      wajib:
        description: |-
          Wajib menandai apakah item ini bersifat wajib (Task 13.12). Nilai pointer
          memungkinkan membedakan field yang tidak dikirim (nil → default true).
        type: boolean
    required:
    - name
    - result
    type: object
  handlers.FieldImageItem:
    properties:
      image_url:
        type: string
    required:
    - image_url
    type: object
  handlers.GenerateReportRequest:
    properties:
      columns:
        items:
          type: string
        minItems: 1
        type: array
      entity:
        enum:
        - cctv
        - maintenance_log
        - field_maintenance
        - spare_part
        type: string
      filters:
        additionalProperties: true
        type: object
      format:
        enum:
        - csv
        - xlsx
        - pdf
        type: string
    required:
    - columns
    - entity
    - format
    type: object
  handlers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handlers.RecordSparePartUsageRequest:
    properties:
      catatan:
        type: string
      jumlah:
        type: integer
      spare_part_id:
        type: string
    required:
    - jumlah
    - spare_part_id
    type: object
  handlers.ReorderChecklistTemplateItem:
    properties:
      id:
        type: string
      urutan:
        minimum: 0
        type: integer
    required:
    - id
    type: object
  handlers.ReorderChecklistTemplatesRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/handlers.ReorderChecklistTemplateItem'
        minItems: 1
        type: array
    required:
    - items
    type: object
  handlers.ResetUserPasswordRequest:
    properties:
      new_password:
        maxLength: 100
        minLength: 8
        type: string
    required:
    - new_password
    type: object
  handlers.SaveReportTemplateRequest:
    properties:
      config:
        type: string
      nama:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - config
    - nama
    type: object
  handlers.ScanCCTVRequest:
    properties:
      qr_payload:
        type: string
    required:
    - qr_payload
    type: object
  handlers.SubscribePushRequest:
    properties:
      endpoint:
        type: string
      key_auth:
        type: string
      key_p256dh:
        type: string
    required:
    - endpoint
    - key_auth
    - key_p256dh
    type: object
  handlers.UpdateCCTVRequest:
    properties:
      channel_port:
        type: integer
      id_channel:
        maxLength: 50
        type: string
      indoor_outdoor:
        enum:
        - indoor
        - outdoor
        - INDOOR
        - OUTDOOR
        type: string
      ip_camera:
        type: string
      ip_nvr:
        type: string
      jenis_cctv:
        maxLength: 50
        type: string
      keterangan:
        type: string
      kode_cctv:
        maxLength: 50
        minLength: 3
        type: string
      latitude:
        type: number
      lokasi_area:
        maxLength: 255
        type: string
      longitude:
        type: number
      nama:
        maxLength: 100
        minLength: 3
        type: string
      pemilik:
        maxLength: 100
        type: string
      rtsp_password:
        type: string
      rtsp_url:
        maxLength: 500
        type: string
      site_id:
        allOf:
        - $ref: '#/definitions/utils.OptionalUUID'
        description: SiteID menunjuk kawasan operasional (Task 12.2) — opsional.
      status:
        enum:
        - aktif
        - pemeliharaan
        - nonaktif
        type: string
      stream_enabled:
        type: boolean
      sumber_listrik:
        maxLength: 50
        type: string
      tipe_koneksi:
        maxLength: 50
        type: string
      zone_id:
        allOf:
        - $ref: '#/definitions/utils.OptionalUUID'
        description: ZoneID menunjuk zona operasional (Task 11.4) — opsional.
    type: object
  handlers.UpdateChecklistTemplateRequest:
    properties:
      aktif:
        type: boolean
      deskripsi:
        maxLength: 2000
        type: string
      nama_item:
        maxLength: 255
        minLength: 1
        type: string
      site_id:
        description: SiteID menunjuk kawasan (site) — dikirim untuk mengubah kawasan
          template.
        type: string
      urutan:
        minimum: 0
        type: integer
      wajib:
        type: boolean
    type: object
  handlers.UpdateMaintenanceLogRequest:
    properties:
      action_taken:
        minLength: 5
        type: string
      cctv_id:
        type: string
      image_url:
        description: URL baru dari /api/upload (opsional)
        type: string
      notes:
        type: string
      scheduled_date:
        description: YYYY-MM-DD HH:MM:SS or RFC3339
        type: string
    type: object
  handlers.UpdateMaintenanceScheduleRequest:
    properties:
      action_taken:
        minLength: 5
        type: string
      cctv_id:
        type: string
      frequency:
        enum:
        - daily
        - weekly
        - monthly
        type: string
      technician_id:
        type: string
    type: object
  handlers.UpdateMyProfileRequest:
    properties:
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      profile_photo_url:
        description: |-
          ProfilePhotoURL bersifat opsional: nil = biarkan foto saat ini, "" = hapus
          foto, selain itu harus path file upload SIGAP ("/api/uploads/...").
        type: string
    required:
    - full_name
    type: object
  handlers.UpdateSLAPolicyRequest:
    properties:
      jenis_tugas:
        enum:
        - corrective
        - preventive
        - field_check
        type: string
      nama:
        maxLength: 100
        minLength: 2
        type: string
      target_jam_respon:
        minimum: 0
        type: integer
      target_jam_selesai:
        minimum: 1
        type: integer
    type: object
  handlers.UpdateSiteRequest:
    properties:
      alamat:
        type: string
      is_default:
        type: boolean
      kode:
        maxLength: 20
        minLength: 1
        type: string
      koordinat_lat:
        type: number
      koordinat_lng:
        type: number
      nama:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  handlers.UpdateSparePartRequest:
    properties:
      harga_satuan:
        minimum: 0
        type: number
      kategori:
        maxLength: 50
        type: string
      keterangan:
        type: string
      minimum_order:
        minimum: 0
        type: integer
      nama:
        maxLength: 100
        minLength: 2
        type: string
      satuan:
        maxLength: 20
        type: string
      site_id:
        type: string
      sku:
        maxLength: 50
        minLength: 2
        type: string
      stok:
        minimum: 0
        type: integer
    type: object
  handlers.UpdateUserRequest:
    properties:
      email:
        maxLength: 100
        type: string
      full_name:
        maxLength: 100
        minLength: 3
        type: string
      role:
        enum:
        - admin
        - teknisi
        type: string
    type: object
  handlers.UpdateWebhookRequest:
    properties:
      events:
        items:
          type: string
        type: array
      is_active:
        type: boolean
      max_log_retention_days:
        minimum: 1
        type: integer
      name:
        maxLength: 100
        minLength: 2
        type: string
      secret:
        minLength: 8
        type: string
      url:
        type: string
    type: object
  handlers.UpdateZoneRequest:
    properties:
      deskripsi:
        type: string
      nama:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  utils.OptionalUUID:
    properties:
      "null":
        description: true if field is null or empty string
        type: boolean
      present:
        description: true if field was explicitly in JSON
        type: boolean
      value:
        type: string
    type: object
host: localhost
info:
  contact: {}
  description: Dokumentasi API Sistem Informasi Gangguan & Aset Pusat (SIGAP) IKN.
  title: SIGAP API
  version: "1.0"
paths:
  /api-keys:
    get:
      description: Mendapatkan daftar API key terpaginasi. Hash tidak dikembalikan;
        hanya prefix dan metadata.
      parameters:
      - description: 'Nomor Halaman (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Jumlah data per halaman (default: 10)'
        in: query
        name: limit
        type: integer
      - description: Pencarian berdasarkan nama
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Daftar API key terpaginasi
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid / Token tidak terdaftar
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil daftar API key
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Ambil Semua API Key
      tags:
      - API Key
    post:
      consumes:
      - application/json
      description: Membuat API key baru untuk integrasi eksternal. Key mentah hanya
        ditampilkan sekali pada respons ini; hash bcrypt disimpan di database. Dapat
        diakses hanya oleh Admin.
      parameters:
      - description: Data API Key Baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: API key berhasil dibuat (key ditampilkan sekali)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validasi gagal atau scope tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid / Token tidak terdaftar
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Akses ditolak: Hanya Admin yang diperbolehkan'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal membuat API key
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Buat API Key
      tags:
      - API Key
  /api-keys/{id}/regenerate:
    post:
      consumes:
      - application/json
      description: Membuat API key baru untuk integrasi yang sudah ada. Key lama otomatis
        tidak berlaku; key mentah hanya ditampilkan sekali.
      parameters:
      - description: API Key UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: API key berhasil diregenerasi (key ditampilkan sekali)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: UUID tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid / Token tidak terdaftar
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Akses ditolak: Hanya Admin yang diperbolehkan'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: API key tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal meregenerasi API key
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Regenerasi API Key (Admin)
      tags:
      - API Key
  /api-keys/{id}/revoke:
    post:
      consumes:
      - application/json
      description: Mencabut API key sehingga tidak dapat digunakan lagi. Key tetap
        tersimpan untuk audit (revoked_at diisi).
      parameters:
      - description: API Key UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: API key berhasil dicabut
          schema:
            additionalProperties: true
            type: object
        "400":
          description: UUID tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid / Token tidak terdaftar
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Akses ditolak: Hanya Admin yang diperbolehkan'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: API key tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mencabut API key
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Cabut API Key
      tags:
      - API Key
  /audit-logs:
    get:
      description: Mengembalikan daftar riwayat aktivitas sistem berdasarkan filter
        modul, rentang tanggal, pencarian, pengurutan, dan paginasi. Hanya bisa diakses
        oleh Admin.
      parameters:
      - description: 'Nomor Halaman (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Jumlah Data per Halaman (default: 10)'
        in: query
        name: limit
        type: integer
      - description: Kolom Pengurutan (created_at, action, module, username)
        in: query
        name: sort_by
        type: string
      - description: Arah Pengurutan (asc, desc)
        in: query
        name: order
        type: string
      - description: Filter berdasarkan nama modul (AUTH, CCTV, ASSET, MAINTENANCE,
          USER)
        in: query
        name: module
        type: string
      - description: Filter rentang awal (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Filter rentang akhir (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: Cari berdasarkan username, action, description, atau ip_address
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Sukses mendapatkan daftar audit log
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sesi tidak valid
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Akses ditolak
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Gagal mengambil data
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mendapatkan Daftar Audit Log
      tags:
      - Audit Log
  /audit-logs/export:
    get:
      description: Mengunduh seluruh riwayat aktivitas sistem terfilter (tanpa limit
        halaman) dalam format file CSV. Hanya bisa diakses oleh Admin.
      parameters:
      - description: Filter berdasarkan nama modul
        in: query
        name: module
