# SIGAP Reverse Proxy (Nginx) — TLS Termination + Security Headers
#
# Routing:
#   /api/*  (termasuk WebSocket /api/ws) -> service api:3000
#   /swagger/* (non-production Swagger UI) -> service api:3000
#   /stream/* (CCTV live streaming WebRTC/WHEP) -> service mediamtx:8889
#   /hls/*    (HLS fallback streaming)          -> service mediamtx:8888
#   /       (aplikasi Next.js)           -> service frontend:3000
#
# Security:
#   - Terminasi TLS (HTTP -> HTTPS redirect)
#   - Hanya protokol TLS 1.2/1.3
#   - Security headers (X-Content-Type-Options, X-Frame-Options, dll.)
#   - Header X-Forwarded-For diteruskan; backend hanya mempercayainya dari IP
#     proxy ini (lihat TRUSTED_PROXY_IPS di backend/.env.docker).

upstream sigap_api       { server api:3000; }
upstream sigap_frontend  { server frontend:3000; }
upstream sigap_mediamtx  { server mediamtx:8889; }

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name _;

    # Seluruh request dipaksa ke HTTPS
    return 301 https://$host$request_uri;
}

# Server HTTPS utama
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Sertifikat TLS (mount dari ./nginx/certs)
    ssl_certificate     /etc/nginx/certs/sigap.crt;
    ssl_certificate_key /etc/nginx/certs/sigap.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Batas ukuran body upload (selaras dengan BodyLimit backend Fiber)
    client_max_body_size 8m;

    # ----- Security Headers -----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # Catatan: CSP & HSTS di-handle backend (Fase 2.7) agar tetap berlaku juga
    # ketika aplikasi diakses langsung tanpa proxy.

    # ----- API Backend (termasuk WebSocket /api/ws) -----
    location /api/ {
        proxy_pass http://sigap_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dukungan WebSocket (upgrade handshake)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----- Swagger UI (non-production) -----
    # Backend memasang Swagger pada route app-level /swagger/*, bukan di bawah /api.
    location /swagger/ {
        proxy_pass http://sigap_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- CCTV Live Streaming via MediaMTX WebRTC/WHEP (Task 9.2) -----
    location /stream/ {
        proxy_pass http://sigap_mediamtx/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    # ----- HLS Fallback (Task 9.2) -----
    location /hls/ {
        proxy_pass http://mediamtx:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ----- Aplikasi Next.js -----
    location / {
        proxy_pass http://sigap_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
