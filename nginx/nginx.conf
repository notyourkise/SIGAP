# SIGAP Reverse Proxy (Nginx) — TLS Termination + Security Headers
#
# Routing:
#   /api/*  (termasuk WebSocket /api/ws) -> service api:3000
#   /swagger/*, /api/metrics, /api/test-panic -> 404 (diagnostik ditutup)
#   /stream/* (CCTV live streaming WebRTC/WHEP) -> service mediamtx:8889 (via auth_request Admin)
#   /hls/*    (HLS fallback streaming)          -> service mediamtx:8888 (via auth_request Admin)
#   /       (aplikasi Next.js)           -> service frontend:3000
#
# Security:
#   - Terminasi TLS (HTTP -> HTTPS redirect)
#   - Hanya protokol TLS 1.2/1.3
#   - Security headers (X-Content-Type-Options, X-Frame-Options, dll.)
#   - Header X-Forwarded-For DITIMPA dengan IP koneksi langsung ($remote_addr),
#     bukan di-append, agar klien tidak bisa memalsukan IP. Backend hanya
#     mempercayainya dari IP proxy ini (lihat TRUSTED_PROXY_IPS di
#     backend/.env.docker). Bila ada load balancer/CDN di depan Nginx, aktifkan
#     modul realip secara eksplisit (set_real_ip_from + real_ip_header) agar
#     $remote_addr berisi IP klien asli.

upstream sigap_api       { server api:3000; }
upstream sigap_frontend  { server frontend:3000; }
upstream sigap_mediamtx  { server mediamtx:8889; }

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name _;

    # Seluruh request dipaksa ke HTTPS
    return 301 https://$host$request_uri;
}

# Server HTTPS utama
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Sertifikat TLS (mount dari ./nginx/certs)
    ssl_certificate     /etc/nginx/certs/sigap.crt;
    ssl_certificate_key /etc/nginx/certs/sigap.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Batas ukuran body upload (selaras dengan BodyLimit backend Fiber)
    client_max_body_size 8m;

    # ----- Security Headers -----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # Catatan: CSP & HSTS di-handle backend (Fase 2.7) agar tetap berlaku juga
    # ketika aplikasi diakses langsung tanpa proxy.

    # ----- Endpoint diagnostik: JANGAN pernah diekspos lewat reverse proxy -----
    # Prometheus tetap boleh scrape langsung ke api:3000 di network internal.
    location = /api/metrics {
        access_log off;
        return 404;
    }
    location ^~ /api/metrics/ {
        access_log off;
        return 404;
    }
    location = /api/test-panic {
        return 404;
    }
    # Swagger UI hanya untuk development. Di production backend juga menolak
    # route ini, tetapi blok ini menjadi lapisan pertahanan kedua.
    location ^~ /swagger {
        return 404;
    }

    # ----- API Backend (termasuk WebSocket /api/ws) -----
    location /api/ {
        proxy_pass http://sigap_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Timpa (jangan append) agar X-Forwarded-For dari klien tidak dipercaya.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dukungan WebSocket (upgrade handshake)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----- Subrequest Otorisasi Streaming (H01 / #167) -----
    # Memvalidasi sesi JWT Admin (belum dicabut/logout), status stream_enabled,
    # dan cakupan site kamera sebelum meneruskan request WHEP/HLS ke MediaMTX.
    location = /_stream_auth {
        internal;
        proxy_pass http://sigap_api/api/streams/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Site-ID $http_x_site_id;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    # ----- CCTV Live Streaming via MediaMTX WebRTC/WHEP (Task 9.2, H01) -----
    location /stream/ {
        auth_request /_stream_auth;

        proxy_pass http://sigap_mediamtx/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    # ----- HLS Fallback (Task 9.2, H01) -----
    location /hls/ {
        auth_request /_stream_auth;

        proxy_pass http://mediamtx:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- Aplikasi Next.js -----
    location / {
        proxy_pass http://sigap_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Timpa (jangan append) agar X-Forwarded-For dari klien tidak dipercaya.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
