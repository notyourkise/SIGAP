apiVersion: 1

providers:
  - name: "SIGAP Dashboards"
    orgId: 1
    folder: "SIGAP"
    folderUid: "sigap-folder"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
