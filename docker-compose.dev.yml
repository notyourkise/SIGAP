# ==========================================
# SIGAP — Development Docker Compose (HTTP mode, no TLS)
# ==========================================
# Untuk development/local testing tanpa TLS certificate
# PRODUCTION HARUS menggunakan TLS dengan sertifikat valid
# ==========================================

services:
  # Service PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: sigap_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?DB password required}
      POSTGRES_DB: ${POSTGRES_DB:-sigap_db}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigap_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sigap_network

  # Service Redis
  redis:
    image: redis:7-alpine
    container_name: sigap_redis_dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sigap_network

  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigap_api_dev
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "3000:3000"  # Exposed for local testing
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/templates:/app/templates:ro
      - api_logs_dev:/app/logs
      - api_tmp_dev:/tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - sigap_network

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sigap_frontend_dev
    restart: unless-stopped
    environment:
      - INTERNAL_BACKEND_URL=http://api:3000
    depends_on:
      - api
    ports:
      - "3001:3000"  # Exposed for local testing
    networks:
      - sigap_network

  # MediaMTX
  mediamtx:
    image: bluenviron/mediamtx:1.20.0-ffmpeg
    container_name: sigap_mediamtx_dev
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8189:8189/udp"  # WebRTC ICE
      - "8889:8889/tcp"  # WebRTC HTTP
      - "8888:8888/tcp"  # HLS
      - "9997:9997/tcp"  # REST API
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    networks:
      - sigap_network

# Named Volumes
volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  api_logs_dev:
    driver: local
  api_tmp_dev:
    driver: local

# Network
networks:
  sigap_network:
    driver: bridge
